<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Sales Tracker & Ledger</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #1e293b;
            text-align: center;
            font-size: 24px;
        }
        /* Dashboard Dashboard Styling */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-box h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
        }
        .stat-box p {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
        }
        .total-box {
            grid-column: span 2;
            background: #ecfdf5;
            border-color: #a7f3d0;
        }
        .total-box p { color: #059669; }

        /* Form Fields Styling */
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #059669; }

        /* Ledger Table Layout */
        .ledger-title {
            margin-top: 30px;
            font-size: 18px;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }
        th { color: #64748b; background-color: #f8fafc; }
        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-links {
            margin-top: 25px;
            text-align: center;
        }
        .nav-links a { color: #3b82f6; text-decoration: none; font-size: 14px; margin: 0 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 Sales Ledger Dashboard</h2>
        
        <!-- Live Statistics Box -->
        <div class="dashboard">
            <div class="stat-box total-box">
                <h3>Total Revenue Today</h3>
                <p id="totalRevenue">0</p>
            </div>
            <div class="stat-box">
                <h3>Items Sold</h3>
                <p id="totalItems">0</p>
            </div>
            <div class="stat-box">
                <h3>Top Category</h3>
                <p id="topCategory">-</p>
            </div>
        </div>

        <!-- Add New Transaction Form -->
        <div class="form-group">
            <label for="itemName">Item Name / Service</label>
            <input type="text" id="itemName" placeholder="e.g., Bread, Haircut, Shoes">
        </div>
        
        <div class="form-group">
            <label for="itemCategory">Category</label>
            <select id="itemCategory">
                <option value="General">General</option>
                <option value="Food & Drinks">Food & Drinks</option>
                <option value="Clothing">Clothing</option>
                <option value="Services">Services</option>
                <option value="Electronics">Electronics</option>
            </select>
        </div>

        <div class="form-group">
            <label for="itemPrice">Amount / Price</label>
            <input type="number" id="itemPrice" placeholder="Enter amount">
        </div>

        <button class="btn-submit" onclick="logSale()">💰 Log New Sale</button>

        <!-- The Historical Ledger Table -->
        <div class="ledger-title">Transaction History</div>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ledgerBody">
                <!-- Javascript will inject sales records here dynamically -->
            </tbody>
        </table>

        <div class="nav-links">
            <a href="index.html">⬅️ Calculator App</a>
            <a href="clock.html">⏱️ Clock App</a>
            <a href="todo.html">📝 To-Do List</a>
        </div>
    </div>

    <script>
        // 1. Core Logic: Check if database has old data, or start fresh
        let salesDatabase = JSON.parse(localStorage.getItem('mySalesData')) || [];

        // Run this immediately to show saved data from yesterday/earlier sessions
        updateUI();

        function logSale() {
            const nameInput = document.getElementById('itemName');
            const catInput = document.getElementById('itemCategory');
            const priceInput = document.getElementById('itemPrice');

            const name = nameInput.value.trim();
            const category = catInput.value;
            const price = parseFloat(priceInput.value);

            // Basic validation
            if (name === "" || isNaN(price) || price <= 0) {
                alert("Please fill in a valid product name and price!");
                return;
            }

            // Create a structured data object for the transaction
            const newSale = {
                id: Date.now(), // Unique identifier to help find/delete it later
                name: name,
                category: category,
                price: price
            };

            // Push object to the array, then commit it to browser LocalStorage database
            salesDatabase.push(newSale);
            localStorage.setItem('mySalesData', JSON.stringify(salesDatabase));

            // Refresh the screen views with fresh database calculations
            updateUI();

            // Clear input boxes for next use
            nameInput.value = "";
            priceInput.value = "";
        }

        function deleteSale(id) {
            // Re-map the database by filtering out the matching target ID
            salesDatabase = salesDatabase.filter(sale => sale.id !== id);
            localStorage.setItem('mySalesData', JSON.stringify(salesDatabase));
            updateUI();
        }

        function updateUI() {
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = ""; // Clear current table UI lines completely before re-drawing

            let runningRevenue = 0;
            let categoryCounts = {};

            // Draw database line-by-line onto the screen matching array objects
            salesDatabase.forEach(sale => {
                runningRevenue += sale.price;
                
                // Track category frequencies
                categoryCounts[sale.category] = (categoryCounts[sale.category] || 0) + 1;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${sale.name}</strong></td>
                    <td><small>${sale.category}</small></td>
                    <td>${sale.price.toLocaleString()}</td>
                    <td><button class="delete-btn" onclick="deleteSale(${sale.id})">❌</button></td>
                `;
                tbody.appendChild(tr);
            });

            // Calculate Top Category dynamically
            let bestCategory = "-";
            let maxCount = 0;
            for (const [cat, count] of Object.entries(categoryCounts)) {
                if (count > maxCount) {
                    maxCount = count;
                    bestCategory = cat;
                }
            }

            // Update top analytics grid metrics
            document.getElementById('totalRevenue').innerText = runningRevenue.toLocaleString();
            document.getElementById('totalItems').innerText = salesDatabase.length;
            document.getElementById('topCategory').innerText = bestCategory;
        }
    </script>

</body>
</html>
